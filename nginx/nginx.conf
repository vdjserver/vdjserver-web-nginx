# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user              nginx;
worker_processes  1;

#error_log   /var/log/nginx/error.log;
#error_log   /var/log/nginx/persistent/error.log;

pid /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # trust these for getting the real IP
    set_real_ip_from  129.0.0.0/8;   # The IP range of TACC vdj VMs
    set_real_ip_from  172.0.0.0/8;   # Standard Docker bridge network range
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format  docker_log  '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" chain: "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  docker_log;

    sendfile    on;
    #tcp_nopush on;

    keepalive_timeout   65;
    client_max_body_size 2m;

    #gzip  on;

    # Load config files from the /etc/nginx/conf.d directory
    # The default server is in conf.d/default.conf
    include /etc/nginx/conf.d/*.conf;

    # proxy for internal webservices
    server {
        listen         8080;
        #server_name    SERVER_NAME;
        #return         301 https://$server_name$request_uri;

        root /var/www/html/vdjserver-v2-web-backbone/app;

        location / {
            try_files $uri /index.html;
        }

        # disable caching
        location /scripts/config/environment-config.js {
            add_header Cache-Control no-store;
        }

        location /docs {
            alias  /var/www/html/docs;
        }

        location /vdjml {
            alias  /var/www/html/vdjml;
        }

        location /xsd {
            alias  /var/www/html/xsd;
        }

        location /vdjpipe {
            alias  /var/www/html/vdjpipe;
        }

#        location /image_cache {
#            alias  /image_cache;
#        }

        # VDJServer API V2
        location /api/v2 {
            proxy_pass http://vdj-api:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;

            # forwarding the real IP through proxies
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # VDJServer R Plumber API V1
#        location /plumber/v1 {
#            proxy_pass http://vdj-plumber:8000;
#            proxy_http_version 1.1;
#            proxy_set_header Upgrade $http_upgrade;
#            proxy_set_header Connection "upgrade";
#            proxy_read_timeout 86400;
#        }

        # We do it this way because we don't want nginx to normalize the url
        # i.e. remove double // and etc as they may need to be passed to agave.
        # We have to remove /guest from the path ourselves in node proxy
#        location /guest {
#            proxy_pass http://vdj-api:8082;
#            proxy_http_version 1.1;
#            proxy_set_header Upgrade $http_upgrade;
#            proxy_set_header Connection "upgrade";
#            proxy_read_timeout 86400;
#        }
    }
}
